name: Dev Publish

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    with:
      setup-script: |
        for attempt in 1 2 3; do
          if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y pkg-config libudev-dev; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
          echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
          sleep 15
        done
